# Publishes the site on GitHub Pages at each push to main, every day, and on demand (Actions > Deploy the site > Run workflow).
# Before the build, "npm run versions" reads the release notes (CHANGELOG.md) of the public repository of the tool:
# a new version of the tool appears on the "What's new" page and in the RSS feed by the next day at the latest.
# To turn on once: repository > Settings > Pages > Source: "GitHub Actions".
# The jobs run only in the repository that publishes the site: a copy or a fork builds nothing.
name: Deploy the site
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Probant-Reporting/probant-reporting.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run versions
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
